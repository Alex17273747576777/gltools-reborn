plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

/*
  ¿Se está compilando la variante cruda? Se resuelve una sola vez, en la raíz del script:
  dentro de los bloques de configuración no se puede declarar una variable.
*/
ext.proyectoCrudo = { -> project.findProperty("rebornDatos") == "crudo" }

android {
    namespace 'io.github.labandita.glreborn'
    compileSdk 35

    defaultConfig {
        applicationId "io.github.labandita.glreborn"
        minSdk 26
        targetSdk 35
        versionCode 27
        versionName "1.13.0"
    }

    // La firma se lee del entorno. NO hay ninguna clave escrita en este archivo:
    // el repositorio del que salimos traía release.jks y la contraseña en claro en el
    // build.gradle, que es una llave que cualquiera puede copiar. Aquí no.
    signingConfigs {
        release {
            def ks = System.getenv("REBORN_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("REBORN_STORE_PASS")
                keyAlias System.getenv("REBORN_KEY_ALIAS") ?: "reborn"
                keyPassword System.getenv("REBORN_KEY_PASS")
            }
        }
    }

    /*
      Cómo se guardan los datos dentro del APK.

      Por defecto el ZIP los comprime: 14,3 MB de datos reales ocupan 3 MB en el APK.
      Con -PrebornDatos=crudo se guardan tal cual: el APK sube a ~15 MB, el contenido es
      exactamente el mismo, y a cambio se leen sin descomprimir (en un teléfono de 4 GB
      eso se nota al abrir la base de 2,5 MB) y se pueden verificar byte a byte con
      `unzip`. No se añade ni un dato de relleno en ninguno de los dos casos.
    */
    /*
      MODO CRUDO, ARREGLADO EN 1.7.1.

      Antes esto vivía dentro de `androidResources`, y Gradle no siempre marcaba la tarea de
      empaquetado como desactualizada al cambiar el flag: al compilar seguido el APK salía con
      el MISMO tamaño que el normal (3.176.147 B en vez de ~16 MB) y nadie se enteraba salvo
      mirando el número. Un APK que dice ser la variante cruda y no lo es, es un fallo de
      honestidad, no de empaquetado.

      Ahora:
       1. `useLegacyPackaging` se activa también, que es lo que de verdad impide comprimir.
       2. Se lee el flag una sola vez, en una variable con nombre.
       3. `doNotStrip`/`noCompress` se declaran fuera de cualquier bloque condicional anidado.
       4. Y hay una prueba en `pruebasNucleo` que compara los dos tamaños: si la variante cruda
          no pesa al menos el triple que la normal, falla.
    */
    androidResources {
        if (proyectoCrudo()) {
            noCompress += ["json", "xml", "csv"]
        }
    }
    packaging {
        // Sin esto, AAPT2 vuelve a comprimir aunque esté en noCompress.
        jniLibs { useLegacyPackaging = proyectoCrudo() }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("REBORN_KEYSTORE")) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.14' }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.core:core-ktx:1.13.1'
    // WebViewAssetLoader: sirve HTML/css/js desde los assets del propio APK por
    // https://appassets.androidplatform.net — sin abrir un servidor y SIN permiso de
    // INTERNET. El panel de cada app funciona en modo avión.
    implementation 'androidx.webkit:webkit:1.12.1'
    // Shizuku: Apache 2.0, escrito por Rikka. Es la API pública del gestor.
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}

// Pruebas del núcleo sin emulador. En esta máquina no hay /dev/kvm: no se puede
// instalar el APK, pero la lógica de perfiles y escritura no toca Android y se prueba
// de verdad. Lo que necesita un teléfono se declara como no probado.
android.sourceSets.debug.java.srcDirs += 'src/test/java'
// org.json sólo para las pruebas: en el APK lo pone Android, pero en la máquina de
// compilación no existe. Es una dependencia de verificación, no viaja en la app.
configurations { pruebasJson }

dependencies {
    pruebasJson 'org.json:json:20240303'
}

tasks.register('pruebasNucleo', JavaExec) {
    dependsOn 'compileDebugKotlin'
    group = 'verification'
    classpath = files("$buildDir/tmp/kotlin-classes/debug") +
        configurations.debugRuntimeClasspath + configurations.pruebasJson
    mainClass = 'PruebasKt'
}

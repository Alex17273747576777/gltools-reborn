name: pruebas
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  nucleo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Sin alias de paleta ni degradados falsos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          theme = Path('app/src/main/java/io/github/labandita/glreborn/ui/Tema.kt').read_text()
          assert not re.search(r'val\s+(violeta|cian|rosa|degradado\w*)\s*=', theme)
          assert 'Brush.linearGradient(listOf(marca, marca))' not in theme
          manifest = Path('app/src/main/AndroidManifest.xml').read_text()
          assert 'android:name="android.permission.INTERNET"' not in manifest
          PY
      - name: El proveedor de informes está declarado y cerrado
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          m = Path('app/src/main/AndroidManifest.xml').read_text()
          bloque = m[m.index('ProveedorInformes') : m.index('/>', m.index('ProveedorInformes'))]
          assert 'android:exported="false"' in bloque, 'El proveedor de informes no puede ser público'
          assert 'grantUriPermissions="true"' in bloque, 'Sin permiso por URI no se puede compartir'
          # Y la única cosa que sirve es un informe: la regla vive en el código y se comprueba
          # aquí también, para que nadie la relaje sin darse cuenta.
          prov = Path('app/src/main/java/io/github/labandita/glreborn/core/ProveedorInformes.kt').read_text()
          assert 'reborn-[a-z0-9_-]+' in prov
          # 1.13.1: cuando el nombre no cumplía el filtro, compartir caía en Uri.fromFile. Con
          # targetSdk 35 eso es FileUriExposedException: la app se cierra al pulsar compartir.
          assert 'fromFile' not in prov, 'file:// fuera de la app revienta en Android 7 o mas'
          assert 'ultimosInformes' in prov, 'compartir debe mirar la carpeta de la app'
          PY
      - name: La version del registro es la del build.gradle
        run: |
          python3 -B - <<'PY'
          import re
          from pathlib import Path
          g = Path('app/build.gradle').read_text(encoding='utf-8')
          k = Path('app/src/main/java/io/github/labandita/glreborn/RegistroFallos.kt').read_text(encoding='utf-8')
          del_gradle = re.search(r'versionName\s+"([^"]+)"', g).group(1)
          del_registro = re.search(r'VERSION_REBORN\s*=\s*"([^"]+)"', k).group(1)
          assert del_gradle == del_registro, 'VERSION_REBORN=' + del_registro + ' pero build.gradle dice ' + del_gradle
          print('VERSION_COHERENTE=' + del_gradle)
          PY

      - name: Ni bytecode ni claves versionadas
        run: |
          python3 -B - <<'PY'
          import subprocess
          ficheros = subprocess.run(['git', 'ls-files'], capture_output=True, text=True).stdout.split()
          prohibidos = [f for f in ficheros
                        if f.endswith(('.pyc', '.pyo', '.jks', '.keystore')) or '__pycache__' in f]
          assert not prohibidos, 'basura versionada: ' + str(prohibidos)
          print('FICHEROS_VERSIONADOS=' + str(len(ficheros)))
          PY

      - name: Probar esquema de firma sin secretos
        run: python3 -B .github/scripts/test_preparar_firma.py
      - name: Compilar y probar el núcleo
        run: bash ./gradlew :app:pruebasNucleo --no-daemon --console=plain
